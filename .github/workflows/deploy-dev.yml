name: Deploy application

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-be-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    name: CI and security gates
    uses: ./.github/workflows/ci.yml
    with:
      image_scan: false

  deploy:
    name: Build, scan and deploy API
    needs: checks
    if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      DEPLOYMENT_CONFIG_PARAMETER: ${{ vars.DEPLOYMENT_CONFIG_PARAMETER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Build release image once
        run: docker build --pull --tag tami-backend:release .

      - name: Scan the image that will be deployed
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.75.0
          scan-type: image
          image-ref: tami-backend:release
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Assume environment deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-erp-be-${{ github.run_id }}

      - name: Discover current infrastructure
        id: target
        run: node scripts/deployment-config.mjs

      - name: Publish the scanned image and resolve its digest
        id: image
        env:
          ACCOUNT_ID: ${{ steps.target.outputs.account_id }}
          ECR_REPOSITORY: ${{ steps.target.outputs.ecr_repository }}
        run: |
          set -euo pipefail
          registry="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          image="$registry/$ECR_REPOSITORY:sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker tag tami-backend:release "$image"
          docker push "$image"
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=${image##*:}" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy through the Terraform-managed SSM document
        env:
          EC2_INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
          DEPLOY_DOCUMENT: ${{ steps.target.outputs.deploy_document }}
          SSM_LOG_GROUP: ${{ steps.target.outputs.ssm_log_group }}
          APP_URL: ${{ steps.target.outputs.app_url }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: node scripts/deploy-api.mjs
