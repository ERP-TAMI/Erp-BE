name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-be-dev
  cancel-in-progress: false

jobs:
  checks:
    name: CI and security gates
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build, scan and deploy API
    needs: checks
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate deployment variables
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SSM_DEPLOY_DIR: ${{ vars.SSM_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]+$ ]]
          [[ "$ECR_REPOSITORY" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          [[ "$SSM_DEPLOY_DIR" == /opt/tami-erp ]]

      # aws-actions/configure-aws-credentials v6.3.0
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-erp-be-dev

      - name: Sign in to private ECR
        id: ecr
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "image=$registry/$ECR_REPOSITORY:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build immutable commit image
        id: build
        env:
          IMAGE: ${{ steps.ecr.outputs.image }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=sha-$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          if [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            docker pull "$IMAGE"
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          else
            docker build --pull --tag "$IMAGE" .
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi

      # aquasecurity/trivy-action v0.36.0
      - name: Scan the exact API image before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.75.0
          scan-type: image
          image-ref: ${{ steps.ecr.outputs.image }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Push image and resolve immutable digest
        id: image
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE: ${{ steps.ecr.outputs.image }}
          REUSE_IMAGE: ${{ steps.build.outputs.reuse }}
        run: |
          set -euo pipefail
          if [[ "$REUSE_IMAGE" != true ]]; then docker push "$IMAGE"; fi
          digest="$(aws ecr describe-images --region "$AWS_REGION" --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=sha-$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy by digest through Systems Manager
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SSM_DEPLOY_DIR: ${{ vars.SSM_DEPLOY_DIR }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SSM_LOG_GROUP: ${{ vars.SSM_LOG_GROUP }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$SSM_LOG_GROUP" =~ ^/[A-Za-z0-9/_-]+$ ]]
          [[ "$APP_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]
          jq -n --arg command "/usr/local/sbin/tami-deploy.sh $IMAGE_DIGEST" \
            '{commands: [$command], executionTimeout: ["1800"]}' > "$RUNNER_TEMP/ssm-parameters.json"
          command_id="$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --cloud-watch-output-config "CloudWatchOutputEnabled=true,CloudWatchLogGroupName=$SSM_LOG_GROUP" \
            --query 'Command.CommandId' --output text)"
          status=Pending
          for _attempt in $(seq 1 180); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 10
          done
          if [[ "$status" != Success ]]; then
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
            exit 1
          fi
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 "$APP_URL/api/health/ready"
          echo "Deployed API digest $IMAGE_DIGEST"
